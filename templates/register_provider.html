{% extends "base.html" %}

{% block title %}Provider Registration{% endblock %}

{% block content %}

<section class="login-page">
    <div class="container">

        <h2 class="section-title_login">Service Provider Registration</h2>

        <div class="login-grid">

            <div class="login-card">
            {% with messages = get_flashed_messages() %}
{% if messages %}
<div class="alert-success">
    {{ messages[0] }}
</div>
{% endif %}
{% endwith %}

                <form method="POST" action="/register-provider">

                    <input type="text" name="name" placeholder="Full Name" required>

                    <input type="email" name="email" placeholder="Email Address" required>

                    <input type="text" name="phone" placeholder="Phone Number" required>

                    <input type="text" name="service" placeholder="Service Type (e.g. Electrician)" required>

                    <input type="number" name="experience" placeholder="Years of Experience" required>

                    <input type="text" name="address" placeholder="Address" required>

                    <input type="password" name="password" placeholder="Password" required>

                    <input type="password" name="confirm" placeholder="Confirm Password" required>

                    <button type="submit" class="btn-login">Register</button>

                </form>

                <p class="login-extra">
                    Already registered?
                    <a href="/login-provider">Login Now</a>
                </p>

            </div>

        </div>

    </div>
</section>

{% endblock %}
